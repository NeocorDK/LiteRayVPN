[package]
name = "literay"
version = "0.1.0"
description = "Lightweight Xray client for Windows"
edition = "2021"
rust-version = "1.85"

[lib]
name = "literay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "socks", "charset"] }
base64 = "0.23"
percent-encoding = "2"
idna = "1"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "2"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.11"
semver = "1"
winreg = "0.56"
log = "0.4"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Networking_WinInet",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Globalization",
]

[dev-dependencies]
insta = { version = "1", features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
